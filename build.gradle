// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.2.10'
    ext.hiltVersion = '2.50' // ADDED: Hilt version for consistency
    ext.navigationVersion = '2.7.7' // ADDED: Navigation version for consistency

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.2.10-2.0.2"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hiltVersion" // ADDED: Hilt Gradle Plugin
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register("clean", Delete) {
    delete(rootProject.layout.buildDirectory)
}